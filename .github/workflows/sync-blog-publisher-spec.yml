name: Sync blog-publisher spec

on:
  repository_dispatch:
    types: [blog-publisher-spec-updated]
  workflow_dispatch:

permissions:
  id-token: write

concurrency:
  group: sync-blog-publisher-spec
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: fohte/spec-sync-action@ec5f1eebb0b16054a38fa04aba4c02b6c09ee9e9 # v0.1.1
        with:
          producer-repo: fohte/blog-publisher
          generate-command: |
            corepack enable
            pnpm install --frozen-lockfile
            pnpm run generate:blog-publisher-contract
          octo-sts-identity: slack-bot-sync-blog-publisher-spec
