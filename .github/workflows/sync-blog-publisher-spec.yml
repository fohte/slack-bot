name: Sync blog-publisher spec

on:
  repository_dispatch:
    types: [blog-publisher-spec-updated]
  workflow_dispatch:

permissions:
  id-token: write

concurrency:
  group: sync-blog-publisher-spec
  cancel-in-progress: false

jobs:
  sync-blog-publisher-spec:
    runs-on: ubuntu-latest

    steps:
      - name: Federate GitHub token via octo-sts
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: slack-bot-sync-blog-publisher-spec
          domain: octo-sts.fohte.net

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.octo-sts.outputs.token }}

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.7.13

      # corepack creates the pnpm executable inside mise's node install bin
      # directory; reshim so the mise shims dir (which is on PATH) picks it up.
      - run: |
          corepack enable
          mise reshim

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      - name: Regenerate blog-publisher contract
        run: pnpm run generate:blog-publisher-contract

      - name: Format generated file
        run: pnpm exec prettier --write src/plugins/blog/generated/blog-publisher-contract.ts

      - name: Check for changes
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- src/plugins/blog/generated/blog-publisher-contract.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.diff.outputs.changed == 'true'
        env:
          BRANCH: sync-blog-publisher-spec
        run: |
          set -euo pipefail
          git checkout -B "${BRANCH}"
          git -c 'user.name=fohte-bot[bot]' \
              -c 'user.email=139195068+fohte-bot[bot]@users.noreply.github.com' \
              commit -am 'blog: sync generated contract from blog-publisher OpenAPI spec'
          # Force-push so the reused branch always equals "main + this run's commit",
          # instead of accumulating one commit per sync.
          git push --force origin "${BRANCH}"

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          BRANCH: sync-blog-publisher-spec
          TITLE: 'blog: sync generated contract from blog-publisher OpenAPI spec'
          BODY: 'Regenerated `src/plugins/blog/generated/blog-publisher-contract.ts` from the latest [blog-publisher OpenAPI spec](https://github.com/fohte/blog-publisher/blob/main/openapi.json).'
        run: |
          set -euo pipefail
          existing_pr=$(gh pr list --head "${BRANCH}" --state open --json url --jq 'map(.url)[0] // ""')
          if [ -n "${existing_pr}" ]; then
            gh pr edit "${existing_pr}" --title "${TITLE}" --body "${BODY}"
          else
            gh pr create --title "${TITLE}" --body "${BODY}" --head "${BRANCH}"
          fi
